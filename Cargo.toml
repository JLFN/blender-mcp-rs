[package]
name = "blender-mcp-rs"
version = "1.8.0"
edition = "2021"
description = "Blender integration through the Model Context Protocol (Rust port of blender-mcp)"
license = "MIT"

# Standalone workspace root: /data is a separate multi-project layout.
[workspace]

[dependencies]
rmcp = { version = "3.1.0", features = ["transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tempfile = "3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
strip = true
lto = true
